<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      // Mirrors src/lib/theme.ts: stored choice wins, otherwise the OS
      // preference, otherwise dark.
      try {
        var t = localStorage.getItem('a2z-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.classList.add(t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <title>A2Z Cyber — find the input that bypasses your validation</title>
    <meta
      name="description"
      content="An adversarial tester for ALG-CYBER-02. Finds the smallest input that breaks a function or bypasses an input validator, shrinks it, fixes it, and proves the fix did not break legitimate behaviour. No signup, no API key."
    />
    <meta property="og:title" content="A2Z Cyber — find the input that bypasses your validation" />
    <meta
      property="og:description"
      content="Paste a validator; get the smallest input that should have been rejected and was not. Then the fix, then the regression test. ALG-CYBER-02."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090f" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="A2Z Cyber" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
