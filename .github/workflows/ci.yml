name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Both engines run untrusted JavaScript, so the sandbox behaviour differs
      # between platforms. Running on Linux is what the deploy target uses.
      - name: Self-test -- all seeded examples must yield a counterexample
        run: npm run selftest

      - name: Benchmark -- detection and false-positive rates
        run: npm run benchmark

      # The ALG-CYBER-02 arc as a judge walks it: find a vulnerability, fix it,
      # retest it, and prove legitimate functionality survived. Exits non-zero if
      # any finding is not FIXED_AND_VERIFIED or any legitimate case regressed.
      - name: Audit -- fix and retest every finding
        run: npm run audit

      - name: Build
        run: npm run build

      # A failure here means the site would show a finding that is not real, or
      # miss one that is. Regenerates the data and compares only the fields that
      # an honest run can reproduce (timing, input counts, and the counterexample
      # for the deliberately non-deterministic case are excluded -- see
      # scripts/check-data.js). Every rate and every verdict must match.
      - name: Check generated data is up to date
        run: npm run check:data

      # Drives the shipped product over HTTP -- the static bundle, the failure
      # paths, and the fix-and-retest arc -- rather than the engine in isolation.
      # Runs after the build because it asserts on the real served output.
      - name: End-to-end -- the running product
        run: npm run test:e2e

      # Generates the runnable suite, runs it, then swaps the fixes back out and
      # runs it again. A regression test that never goes red is not a regression
      # test, and this is what proves these do. It runs the real vulnerable
      # ReDoS, so it is deliberately a separate step with its own budget.
      - name: Generate the regression test and prove it fails on the bug
        run: |
          npm run regression-test
          npm run verify:regression-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7